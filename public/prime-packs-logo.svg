<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 340 80' fill='none'>
  <defs>
    <filter id='neon-glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='0' stdDeviation='4' flood-color='#00F076' flood-opacity='0.4'/>
    </filter>
    <linearGradient id='p-grad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FFFFFF'/>
      <stop offset='100%' stop-color='#E6E8EE'/>
    </linearGradient>
  </defs>
  <!-- Card 1 (Back, Neon Green) -->
  <g transform='translate(8, 6) rotate(-16 32 40)'>
    <rect x='10' y='12' width='32' height='56' rx='6' fill='#00F076' filter='url(#neon-glow)'/>
  </g>
  <!-- Card 2 (Middle, White with Neon Top Edge) -->
  <g transform='translate(14, 4) rotate(-8 36 40)'>
    <rect x='12' y='11' width='33' height='58' rx='6' fill='#FFFFFF' stroke='#00F076' stroke-width='2'/>
    <path d='M 14 13 L 43 13' stroke='#00F076' stroke-width='4' stroke-linecap='round'/>
  </g>
  <!-- Card 3 (Front, Stylized P Slab) -->
  <g transform='translate(20, 2)'>
    <path fill-rule='evenodd' clip-rule='evenodd' d='M 12 10 C 12 7.8 13.8 6 16 6 H 48 C 59 6 68 15 68 26 C 68 37 59 46 48 46 H 30 V 68 C 30 70.2 28.2 72 26 72 H 16 C 13.8 72 12 70.2 12 68 V 10 Z M 30 20 V 32 H 46 C 49.3 32 52 29.3 52 26 C 52 22.7 49.3 20 46 20 H 30 Z' fill='url(#p-grad)'/>
  </g>
  <!-- Typography PRIME PACKS -->
  <text x='96' y='52' fill='#FFFFFF' font-family='Outfit, -apple-system, sans-serif' font-weight='900' font-size='37' letter-spacing='-0.03em'>PRIME</text>
  <text x='206' y='52' fill='#00F076' font-family='Outfit, -apple-system, sans-serif' font-weight='900' font-size='37' letter-spacing='-0.03em' filter='url(#neon-glow)'>PACKS</text>
</svg>